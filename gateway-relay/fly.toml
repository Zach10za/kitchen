# Fly.io config for the kitchen-gateway-relay.
#
# Always-on tiny VM holding the Discord Gateway WebSocket. Forwards messages
# to the Cloudflare Worker via HTTPS.

app = "kitchen-gateway"
primary_region = "sjc"

[build]

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  # Always-on: this is a long-lived WebSocket client, not a request handler.
  # Auto-stop would kill the gateway connection.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
